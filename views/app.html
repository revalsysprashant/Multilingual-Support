<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1017;
    --surface:#1a1d28;
    --surface-2:#22273a;
    --line:#2a2f42;
    --text:#edeef2;
    --text-dim:#8a8fa3;
    --coral:#ff5d3a;
    --coral-dim:#5c2b1f;
    --cyan:#4ad8d8;
    --cyan-dim:#1f4a4a;
    --amber:#ffb74a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #1b2033 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.02em;
  }
  .brand span{color:var(--coral);}
  .lang-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:4px 8px;
    border-radius:20px;
    letter-spacing:0.03em;
  }

  /* Header */
  .header-right{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .clear-btn{
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 10px;
    font-size:11px;
    font-family:'JetBrains Mono',monospace;
    cursor:pointer;
    transition:.15s;
  }
  .clear-btn:hover{color:var(--coral);border-color:var(--coral-dim);}

  /* Orb */
  .orb-stage{
    position:relative;
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .orb{
    position:relative;
    width:96px;
    height:96px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #333a52, #181b28 70%);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:box-shadow .3s ease, border-color .3s ease;
    z-index:2;
  }
  .orb::before{
    content:'';
    position:absolute;
    inset:-40px;
    border-radius:50%;
    border:1px solid var(--line);
    opacity:0;
    transition:opacity .3s ease;
  }
  .orb::after{
    content:'';
    position:absolute;
    inset:-70px;
    border-radius:50%;
    border:1px solid var(--line);
    opacity:0;
    transition:opacity .3s ease;
  }
  .orb-core{
    width:14px;height:14px;border-radius:50%;
    background:var(--text-dim);
    transition:all .25s ease;
  }
  /* states */
  .app[data-state="listening"] .orb{box-shadow:0 0 0 var(--pulse,0px) rgba(255,93,58,.18); border-color:var(--coral);}
  .app[data-state="listening"] .orb-core{background:var(--coral); box-shadow:0 0 24px 4px rgba(255,93,58,.5);}
  .app[data-state="listening"] .orb::before,.app[data-state="listening"] .orb::after{opacity:1;border-color:var(--coral-dim);animation:ripple 1.8s ease-out infinite;}
  .app[data-state="listening"] .orb::after{animation-delay:.5s;}

  .app[data-state="thinking"] .orb{border-color:var(--amber);}
  .app[data-state="thinking"] .orb-core{background:var(--amber);animation:spin-pulse 1.1s ease-in-out infinite;}

  .app[data-state="speaking"] .orb{border-color:var(--cyan);}
  .app[data-state="speaking"] .orb-core{background:var(--cyan);box-shadow:0 0 24px 4px rgba(74,216,216,.5);animation:speak-pulse .5s ease-in-out infinite alternate;}
  .app[data-state="speaking"] .orb::before{opacity:1;border-color:var(--cyan-dim);animation:ripple 1.6s ease-out infinite;}

  @keyframes ripple{
    0%{transform:scale(.6);opacity:.7;}
    100%{transform:scale(1.15);opacity:0;}
  }
  @keyframes spin-pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.4);}
  }
  @keyframes speak-pulse{
    0%{transform:scale(1);}
    100%{transform:scale(1.5);}
  }

  .status-line{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:.02em;
    min-height:16px;
  }

  /* Transcript */
  .transcript{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:320px;
    overflow-y:auto;
    padding:4px 2px;
  }
  .transcript:empty{display:none;}
  .bubble{
    max-width:82%;
    padding:10px 14px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    animation:rise .25s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .bubble.user{
    align-self:flex-end;
    background:var(--coral);
    color:#1a0d08;
    border-bottom-right-radius:4px;
    font-weight:500;
  }
  .bubble.assistant{
    align-self:flex-start;
    background:var(--surface);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .bubble.system{
    align-self:center;
    background:transparent;
    border:1px dashed var(--line);
    color:var(--text-dim);
    font-size:12.5px;
    font-family:'JetBrains Mono',monospace;
  }
  .bubble.unsupported{
    border-color:var(--amber);
  }
  .bubble-wrap{
    display:flex;
    flex-direction:column;
    gap:4px;
    max-width:82%;
  }
  .bubble-wrap.user{ align-self:flex-end; align-items:flex-end; }
  .bubble-wrap.assistant{ align-self:flex-start; align-items:flex-start; }
  .bubble-wrap .bubble{ max-width:100%; }
  .bubble-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:.03em;
    padding:0 4px;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .bubble-meta .no-voice{
    opacity:.7;
  }

  /* Controls */
  .controls{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .mic-btn{
    width:66px;height:66px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:var(--coral);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px -6px rgba(255,93,58,.5);
    transition:transform .15s ease, background .2s ease;
  }
  .mic-btn:hover{transform:scale(1.05);}
  .mic-btn:active{transform:scale(.96);}
  .mic-btn[disabled]{background:var(--surface-2);box-shadow:none;cursor:not-allowed;}
  .mic-btn.recording{background:var(--amber);}
  .mic-btn svg{width:24px;height:24px;}
  .hint{font-size:12px;color:var(--text-dim);}

  .type-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .type-row input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:11px 16px;
    outline:none;
    transition:border-color .15s ease;
  }
  .type-row input::placeholder{color:var(--text-dim);}
  .type-row input:focus{border-color:var(--cyan-dim);}
  .type-row input[disabled]{opacity:.5;}
  .send-btn{
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    flex-shrink:0;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:.15s ease;
  }
  .send-btn:hover{border-color:var(--cyan-dim);color:var(--cyan);}
  .send-btn[disabled]{opacity:.4;cursor:not-allowed;}
  .send-btn svg{width:17px;height:17px;}
  .divider-row{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.05em;
  }
  .divider-row::before,.divider-row::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  select.voice-select{
    background:var(--surface);
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:8px;
    font-size:11px;
    font-family:'JetBrains Mono',monospace;
    padding:4px 6px;
  }
  .footer-row{
    display:flex;
    justify-content:center;
    gap:10px;
    align-items:center;
  }
</style>
</head>
<body>

<div class="app" id="app" data-state="idle">
  <header>
    <div class="brand">voice<span>/</span>support</div>
    <div class="header-right">
      <span class="lang-tag" id="userTag" title="Loading supported languages…">multilingual &middot; groq</span>
      <button class="clear-btn" id="clearBtn" title="Clear chat history">clear</button>
      <button class="clear-btn" id="logoutBtn" title="Log out">logout</button>
    </div>
  </header>

  <div class="orb-stage">
    <div class="orb"><div class="orb-core"></div></div>
  </div>
  <div class="status-line" id="statusLine">starting a new chat…</div>

  <div class="transcript" id="transcript"></div>

  <div class="controls">
    <div class="type-row">
      <input id="textInput" type="text" placeholder="Type a message instead…" disabled autocomplete="off">
      <button class="send-btn" id="sendBtn" disabled title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="divider-row">or speak</div>
    <button class="mic-btn" id="micBtn" disabled title="Loading…">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a0d08" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <div class="hint" id="hint">connecting…</div>
  </div>
</div>

<script>
(function(){
  const SILENCE_THRESHOLD = 0.012;   // RMS level below this = silence
  const SILENCE_STOP_MS   = 1700;    // auto-stop after this much continuous silence
  const MIN_SPEECH_MS     = 350;     // recordings shorter than this are treated as noise/no-speech
  const MAX_RECORD_MS     = 15000;   // hard cap so a stuck mic doesn't record forever

  let mediaStream, mediaRecorder, audioChunks = [];
  let audioCtx, analyser, sourceNode, vadRAF;
  let recordStart = 0, speechDetected = false, silenceStart = null;

  const app = document.getElementById('app');
  const statusLine = document.getElementById('statusLine');
  const transcriptEl = document.getElementById('transcript');
  const micBtn = document.getElementById('micBtn');
  const hint = document.getElementById('hint');
  const clearBtn = document.getElementById('clearBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userTag = document.getElementById('userTag');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');

  function setState(s){ app.setAttribute('data-state', s); }
  function setStatus(t){ statusLine.textContent = t; }

  // meta: optional { language, ttsAvailable, supported } to show a small caption above the bubble
  function addBubble(role, text, meta){
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap ' + role;

    if(meta && meta.language){
      const metaEl = document.createElement('div');
      metaEl.className = 'bubble-meta';
      if(meta.supported === false){
        metaEl.textContent = `⚠ ${meta.language} not supported yet`;
      } else {
        const langSpan = document.createTextNode(meta.language);
        metaEl.appendChild(langSpan);
        if(role === 'assistant' && meta.ttsAvailable === false){
          const noVoice = document.createElement('span');
          noVoice.className = 'no-voice';
          noVoice.textContent = ' · 🔇 text only for now';
          metaEl.appendChild(noVoice);
        }
      }
      wrap.appendChild(metaEl);
    }

    const b = document.createElement('div');
    b.className = 'bubble ' + role + (meta && meta.supported === false ? ' unsupported' : '');
    b.textContent = text;
    wrap.appendChild(b);

    transcriptEl.appendChild(wrap);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    return wrap;
  }

  // ---- Boot: confirm session, show the logged-in user + supported languages, start with a clean slate ----
  async function boot(){
    try{
      const meRes = await fetch('/api/me');
      if(meRes.status === 401){ window.location.href = '/login.html'; return; }
      const me = await meRes.json();

      try{
        const langRes = await fetch('/api/languages');
        if(langRes.ok){
          const langData = await langRes.json();
          userTag.title = `Supported languages: ${langData.supported.join(', ')}. Voice replies: ${langData.ttsSupported.join(', ')} only.`;
        }
      }catch(err){ /* non-fatal — tooltip just won't populate */ }

      userTag.textContent = `${me.username} · multilingual · groq`;

      await fetch('/api/reset', { method: 'POST' });
    }catch(err){
      console.error(err);
      addBubble('system', "Couldn't reach the server — make sure it's running (npm start) and refresh.");
    }
    micBtn.disabled = false;
    micBtn.title = "Tap to talk";
    textInput.disabled = false;
    sendBtn.disabled = false;
    hint.textContent = "speak or type in any supported language";
    setStatus("ready — talk or type, any supported language");
  }
  boot();

  logoutBtn.addEventListener('click', async () => {
    try{ await fetch('/api/logout', { method: 'POST' }); } catch(err){}
    window.location.href = '/login.html';
  });

  clearBtn.addEventListener('click', async () => {
    try{
      await fetch('/api/reset', { method: 'POST' });
      transcriptEl.innerHTML = '';
      addBubble('system', 'Chat history cleared.');
    }catch(err){
      addBubble('system', 'Could not clear history — try again.');
    }
  });

  // ---- Typed messages ----
  function sendTyped(){
    const text = textInput.value.trim();
    if(!text || sendBtn.disabled) return;
    textInput.value = '';
    micBtn.disabled = true;
    processUserMessage(text);
  }
  sendBtn.addEventListener('click', sendTyped);
  textInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendTyped(); });

  // ---- Mic toggle ----
  let isRecording = false;
  micBtn.addEventListener('click', () => {
    if (isRecording) stopRecording('manual');
    else startRecording();
  });

  async function startRecording(){
    try{
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1
        }
      });
    }catch(err){
      addBubble('system', "Couldn't access your microphone — check your browser's permission settings and try again.");
      setStatus('microphone permission needed');
      return;
    }

    audioChunks = [];
    speechDetected = false;
    silenceStart = null;
    recordStart = Date.now();

    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: pickMime(), audioBitsPerSecond: 128000 });
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = handleRecordingStopped;
    mediaRecorder.start();

    // Simple VAD via WebAudio analyser
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    sourceNode.connect(analyser);
    monitorVolume();

    isRecording = true;
    micBtn.classList.add('recording');
    textInput.disabled = true;
    sendBtn.disabled = true;
    setState('listening');
    setStatus('listening…');
    hint.textContent = 'tap again to stop';
  }

  function pickMime(){
    const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4'];
    for(const c of candidates){ if(MediaRecorder.isTypeSupported(c)) return c; }
    return '';
  }

  function monitorVolume(){
    const data = new Uint8Array(analyser.fftSize);
    const orbCore = document.querySelector('.orb');

    function tick(){
      analyser.getByteTimeDomainData(data);
      let sumSq = 0;
      for(let i=0;i<data.length;i++){
        const v = (data[i]-128)/128;
        sumSq += v*v;
      }
      const rms = Math.sqrt(sumSq/data.length);
      orbCore.style.setProperty('--pulse', Math.min(30, rms*300)+'px');

      const elapsed = Date.now() - recordStart;

      if(rms > SILENCE_THRESHOLD){
        speechDetected = true;
        silenceStart = null;
      } else if(speechDetected){
        if(silenceStart === null) silenceStart = Date.now();
        else if(Date.now() - silenceStart > SILENCE_STOP_MS){
          stopRecording('silence');
          return;
        }
      }

      if(elapsed > MAX_RECORD_MS){
        stopRecording('timeout');
        return;
      }

      vadRAF = requestAnimationFrame(tick);
    }
    vadRAF = requestAnimationFrame(tick);
  }

  function stopRecording(reason){
    if(!isRecording) return;
    isRecording = false;
    cancelAnimationFrame(vadRAF);
    micBtn.classList.remove('recording');
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if(mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    if(audioCtx) audioCtx.close();
    micBtn.disabled = true;
    setStatus(reason === 'timeout' ? 'stopped — that was a long one' : 'processing…');
  }

  async function handleRecordingStopped(){
    const elapsed = Date.now() - recordStart;
    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });

    // Exception handling: too short / no speech energy detected at all
    if(elapsed < MIN_SPEECH_MS || !speechDetected){
      micBtn.disabled = false;
      textInput.disabled = false;
      sendBtn.disabled = false;
      setState('idle');
      setStatus('ready — talk or type, any supported language');
      addBubble('system', "I didn't catch any speech there — mind trying again? A bit closer to the mic helps too.");
      return;
    }

    setState('thinking');
    setStatus('transcribing…');

    let userText;
    try{
      userText = await transcribeAudio(blob);
    }catch(err){
      handleFailure('Transcription', err);
      return;
    }

    if(!userText || !userText.trim() || /^\s*[.,\-\u2026]*\s*$/.test(userText)){
      micBtn.disabled = false;
      setState('idle');
      setStatus('ready — talk or type, any supported language');
      addBubble('system', "That came through unclear — possibly background noise. Could you repeat that?");
      return;
    }

    await processUserMessage(userText, { speakReply: true, lockedByMic: true });
  }

  // Shared pipeline: intent understanding -> response generation -> (optionally) speech.
  // Used by both the voice path and the typed-text path so a chatbot works the same either way,
  // in whichever language the user just used.
  async function processUserMessage(userText, opts){
    opts = opts || {};
    const lockedByMic = !!opts.lockedByMic;
    if(!lockedByMic){
      setState('thinking');
      textInput.disabled = true;
      sendBtn.disabled = true;
    }

    addBubble('user', userText);

    setStatus('thinking…');
    let result;
    try{
      result = await getAssistantReply(userText);
    }catch(err){
      handleFailure('Response generation', err);
      return;
    }

    addBubble('assistant', result.reply, {
      language: result.language,
      supported: result.supported,
      ttsAvailable: result.ttsAvailable
    });

    // Only attempt voice playback for languages Groq's TTS actually supports (English right now).
    // Unsupported-language replies also skip voice — there's nothing meaningful to speak aloud.
    if(result.supported !== false && result.ttsAvailable){
      setStatus('speaking…');
      setState('speaking');
      try{
        await speak(result.reply, result.language);
      }catch(err){
        // Non-fatal: text is already shown, but surface the real reason for debugging
        console.error('Speech playback failed:', err);
        const msg = String(err && err.message || err);
        addBubble('system', `Reply above is accurate — voice playback failed (${msg}).`);
      }
    }

    micBtn.disabled = false;
    textInput.disabled = false;
    sendBtn.disabled = false;
    setState('idle');
    setStatus('ready — talk or type, any supported language');
  }

  function handleFailure(stage, err){
    console.error(stage, err);
    micBtn.disabled = false;
    textInput.disabled = false;
    sendBtn.disabled = false;
    setState('idle');
    setStatus('ready — talk or type, any supported language');
    const msg = String(err && err.message || err);
    addBubble('system', `${stage} hit a snag (${msg}). Could you try that again?`);
  }

  // ---- Backend: Speech-to-Text (server holds the Groq key) ----
  async function transcribeAudio(blob){
    const form = new FormData();
    const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
    form.append('audio', blob, `speech.${ext}`);

    const res = await fetch('/api/transcribe', { method: 'POST', body: form });
    if(res.status === 401){ window.location.href = '/login.html'; throw new Error('Session expired'); }
    if(!res.ok) throw new Error(`${res.status} ${await safeErrText(res)}`);
    const data = await res.json();
    return data.text || '';
  }

  // ---- Backend: intent understanding + response generation (history persisted server-side) ----
  async function getAssistantReply(userText){
    const res = await fetch('/api/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: userText })
    });
    if(res.status === 401){ window.location.href = '/login.html'; throw new Error('Session expired'); }
    if(!res.ok) throw new Error(`${res.status} ${await safeErrText(res)}`);
    const data = await res.json();
    return {
      reply: data.reply || "I'm not sure how to respond to that — could you rephrase it?",
      language: data.language || 'English',
      supported: data.supported !== false,
      ttsAvailable: !!data.ttsAvailable
    };
  }

  // ---- Backend: Text-to-Speech ----
  async function speak(text, language){
    const res = await fetch('/api/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, language: language || 'English' })
    });
    if(res.status === 401){ window.location.href = '/login.html'; throw new Error('Session expired'); }
    if(!res.ok) throw new Error(`${res.status} ${await safeErrText(res)}`);
    const arrayBuf = await res.arrayBuffer();
    const blob = new Blob([arrayBuf], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    await new Promise((resolve, reject) => {
      audio.onended = resolve;
      audio.onerror = () => reject(new Error(audio.error?.message || `audio decode error (code ${audio.error?.code})`));
      audio.play().catch(playErr => reject(new Error(playErr?.message || String(playErr))));
    });
    URL.revokeObjectURL(url);
  }

  async function safeErrText(res){
    try{
      const j = await res.json();
      return j.error?.message || JSON.stringify(j);
    }catch(e){
      return res.statusText;
    }
  }
})();
</script>
